name: Publish verified static output
# Hosting is separate from morning analytics. GITHUB_TOKEN pushes do not trigger
# push workflows, so workflow_run handles generated-data commits.
on:
  workflow_run:
    workflows: ['Morning analytics']
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'Views/**'
      - 'wwwroot/**'
      - 'StaticSite/**'
      - 'Services/StaticSiteExporter.cs'
      - 'data/generated/site/**'
      - 'artifacts/daily-health/**'
      - '.github/workflows/static-hosting.yml'
      - 'Tools/h4-zone-*.cjs'
      - 'Tools/H4SqlImport/**'
      - 'Tools/ZonePriceImport/**'
      - 'Tools/cfd-zone-*.cjs'
      - 'Tools/fetch-zone-crypto.ps1'
      - 'Services/SeasonalityService.cs'
      - 'Services/AssetClassification.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: seasonality-static-hosting
  cancel-in-progress: false
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Skip hosting for deduplicated/no-op morning runs
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" != workflow_run ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '[.artifacts[] | select(.name == "daily-health")] | length')
            if [ "$count" -gt 0 ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v4
        if: steps.publication.outputs.run == 'true'
        with:
          ref: master
      - uses: actions/setup-dotnet@v4
        if: steps.publication.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Assemble previously verified static outputs (no analytics or SQL)
        if: steps.publication.outputs.run == 'true'
        run: |
          test -s data/generated/site/data/manifest.json
          mkdir -p artifacts/public-site
          cp -R data/generated/site/. artifacts/public-site/
          # Latest UI assets must not be overwritten by the previous morning snapshot.
          cp -R wwwroot/. artifacts/public-site/
          node Tools/retire-htf-snapshot.cjs artifacts/public-site
          mkdir -p artifacts/public-site/artifacts/daily-health
          cp artifacts/daily-health/*.json artifacts/public-site/artifacts/daily-health/
          # Render current Razor navigation and the Data view without SQL or analytics.
          node Tools/data-runs-checks.cjs
          node Tools/trade-zones-checks.cjs
          node Tools/trade-zone-table-checks.cjs
          node Tools/market-date-checks.cjs
          node Tools/htf-retirement-checks.cjs
          dotnet build SeasonalityApp.slnx --configuration Release
          dotnet bin/Release/net10.0/SeasonalityApp.dll --render-static-shell --output artifacts/public-site
          node Tools/zone-prices-checks.cjs artifacts/public-site
          cp StaticSite/staticwebapp.config.json artifacts/public-site/staticwebapp.config.json
      - name: Add SQL-validated H4 sidecar for trading zones only
        if: steps.publication.outputs.run == 'true'
        env:
          SEASONALITY_H4_SQL_CONNECTION: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
        run: |
          node Tools/h4-zone-checks.cjs
          node Tools/h4-zone-live-checks.cjs
          dotnet build Tools/H4SqlImport/H4SqlImport.csproj -c Release
          dotnet Tools/H4SqlImport/bin/Release/net10.0/H4SqlImport.dll --export-zone-source --config-root . --output artifacts/h4-hosting-source.json
          node Tools/h4-zone-snapshot.cjs overlay artifacts/h4-hosting-source.json artifacts/public-site
          node Tools/h4-zone-snapshot-checks.cjs artifacts/public-site
          node Tools/liquidity-setup-checks.cjs artifacts/public-site
      - name: Export isolated CFD zone prices and verify Yahoo crypto identity
        if: steps.publication.outputs.run == 'true'
        env:
          SEASONALITY_H4_SQL_CONNECTION: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
        run: |
          dotnet build Tools/ZonePriceImport/ZonePriceImport.csproj -c Release
          dotnet Tools/ZonePriceImport/bin/Release/net10.0/ZonePriceImport.dll --checks
          dotnet Tools/ZonePriceImport/bin/Release/net10.0/ZonePriceImport.dll --export --config-root . --output artifacts/cfd-zone-source.json
          pwsh -NoProfile -File Tools/fetch-zone-crypto.ps1 -OutputDir artifacts/zone-crypto
          node Tools/cfd-zone-snapshot.cjs artifacts/public-site artifacts/cfd-zone-source.json artifacts/zone-crypto
          node Tools/cfd-zone-checks.cjs artifacts/public-site
      - name: Overlay this morning's report including failed runs (keep last good analytics)
        if: steps.publication.outputs.run == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name daily-health --dir artifacts/run-health
          cp artifacts/run-health/*.json artifacts/public-site/artifacts/daily-health/
      - name: Existing Azure static hosting publication
        if: steps.publication.outputs.run == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/public-site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: master
