name: Publish verified static output
# Hosting is separate from morning analytics. GITHUB_TOKEN pushes do not trigger
# push workflows, so workflow_run handles generated-data commits.
on:
  workflow_run:
    workflows: ['Morning analytics', 'Weekly COT refresh', 'Dukascopy market collection', 'Dukascopy daily analytics']
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'Views/**'
      - 'wwwroot/**'
      - 'StaticSite/**'
      - 'Services/StaticSiteExporter.cs'
      - 'data/generated/site/**'
      - 'artifacts/daily-health/**'
      - '.github/workflows/static-hosting.yml'
      - 'Tools/h4-zone-*.cjs'
      - 'Tools/H4SqlImport/**'
      - 'Tools/ZonePriceImport/**'
      - 'Tools/PaperTradeStore/**'
      - 'Tools/PaperResearchStore/**'
      - 'Tools/H4History/**'
      - 'Tools/h4-paper-*.cjs'
      - 'Tools/h4-backtest-*.cjs'
      - 'Tools/cfd-zone-*.cjs'
      - 'Tools/fetch-zone-crypto.ps1'
      - 'Services/SeasonalityService.cs'
      - 'Services/AssetClassification.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publication:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.publication.outputs.run }}
    steps:
      - name: Skip hosting for deduplicated/no-op morning runs
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$EVENT_NAME" != workflow_run ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            artifact=daily-health
            if [ "$SOURCE_WORKFLOW" = 'Weekly COT refresh' ]; then artifact=cot-publication; fi
            if [ "$SOURCE_WORKFLOW" = 'Dukascopy market collection' ]; then artifact=dukascopy-sql-source; fi
            if [ "$SOURCE_WORKFLOW" = 'Dukascopy daily analytics' ]; then artifact=dukascopy-daily-publication; fi
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq "[.artifacts[] | select(.name == \"$artifact\")] | length")
            if [ "$count" -gt 0 ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
          fi
  hosting:
    needs: publication
    if: needs.publication.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: seasonality-static-hosting
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble previously verified static outputs (no analytics or SQL)
        run: |
          test -s data/generated/site/data/manifest.json
          mkdir -p artifacts/public-site
          cp -R data/generated/site/. artifacts/public-site/
          # Latest UI assets must not be overwritten by the previous morning snapshot.
          cp -R wwwroot/. artifacts/public-site/
          node Tools/retire-htf-snapshot.cjs artifacts/public-site
          mkdir -p artifacts/public-site/artifacts/daily-health
          cp artifacts/daily-health/*.json artifacts/public-site/artifacts/daily-health/
          # Render current Razor navigation and the Data view without SQL or analytics.
          node Tools/data-runs-checks.cjs
          node Tools/trade-zones-checks.cjs
          node Tools/trade-zone-view-state-checks.cjs
          node Tools/trade-zone-table-checks.cjs
          node Tools/strategy-lab-checks.cjs wwwroot/research/strategy-lab-pilot.json
          node Tools/fm-order-blocks-checks.cjs wwwroot/research/fm-outlook-pilot.json
          node Tools/fm-trade-zones-checks.cjs
          node Tools/h4-paper-checks.cjs
          node Tools/h4-paper-table-checks.cjs
          node Tools/h4-backtest-checks.cjs
          node Tools/h4-backtest-format-checks.cjs
          node Tools/cot-refresh-checks.cjs
          node Tools/h4-paper-research-checks.cjs
          node Tools/chart-time-checks.cjs
          node Tools/market-date-checks.cjs
          node Tools/htf-retirement-checks.cjs
          dotnet build SeasonalityApp.slnx --configuration Release
          dotnet bin/Release/net10.0/SeasonalityApp.dll --render-static-shell --output artifacts/public-site
          node Tools/zone-prices-checks.cjs artifacts/public-site
          cp StaticSite/staticwebapp.config.json artifacts/public-site/staticwebapp.config.json
      - name: Preserve last verified published datasets and immutable ledger
        run: node Tools/preserve-published-h4.cjs artifacts/public-site false
      - name: Apply latest verified Dukascopy FX and CFD projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "dukascopy-sql-source" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -n "$run_id" ] && [ "$run_id" != null ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name dukascopy-sql-source --dir artifacts/dukascopy-sql
            node Tools/dukascopy-zone-snapshot.cjs artifacts/public-site artifacts/dukascopy-sql/source.json
            node Tools/dukascopy-backtest-history.cjs artifacts/public-site artifacts/dukascopy-sql/source.json
            if [ -s artifacts/dukascopy-sql/ledger.json ]; then
              cp artifacts/dukascopy-sql/ledger.json artifacts/public-site/data/h4-paper/ledger.json
            fi
          fi
      - name: Verify Dukascopy is the only active H4 provider
        run: node Tools/dukascopy-publication-checks.cjs artifacts/public-site
      - name: Exclude obsolete generated JSON from the free hosting bundle
        run: |
          node Tools/prune-static-output.cjs artifacts/public-site artifacts/unpublished-json
          node Tools/static-site-checks.cjs artifacts/public-site
      - name: Overlay this morning's report including failed runs (keep last good analytics)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Morning analytics'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name daily-health --dir artifacts/run-health
          cp artifacts/run-health/*.json artifacts/public-site/artifacts/daily-health/
      - name: Existing Azure static hosting publication
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/public-site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: master
