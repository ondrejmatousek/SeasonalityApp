# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Seasonality

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'data/generated/**'
      - 'data/market-state/**'
      - 'data/market-daily/**'
      - 'artifacts/daily-health/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore TradingView state and prepare read-only market bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node Tools/market-history-seed.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore audited TradingView seed' }
          node Tools/prepare-market-sources.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare market bundle' }

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Completed Yahoo sessions and WTI display date regressions
        run: |
          dotnet run --project Tools/PriceImportChecks/PriceImportChecks.csproj -c Release
          node Tools/market-date-checks.cjs

      - name: Isolated HTTP probe regression (no SQL or external requests)
        run: node Tools/market-daily-probe-checks.cjs

      - name: Read-only market admission regression (isolated histories, no production writes)
        run: node Tools/market-daily-preflight-checks.cjs

      - name: Checkout-independent SQL worker baseline regression
        run: node Tools/market-daily-sql-worker-checks.cjs

      - name: SQL publication evidence and generation safety regression
        run: node Tools/market-daily-sql-publication-checks.cjs

      - name: Isolated MCP OAuth resource regression (no SQL or external requests)
        run: dotnet run --project Tools/MarketMcpChecks/MarketMcpChecks.csproj -c Release

      - name: Isolated Auth0 MCP resource regression (no SQL or external requests)
        run: dotnet run --project Tools/MarketMcpChecks/MarketMcpChecks.csproj -c Release -- --auth0
      - name: H4 ingestion boundary and scoped MCP regression (no SQL or provider requests)
        run: |
          dotnet run --project Tools/H4SqlImport/H4SqlImport.csproj -c Release -- --h4-live-validation
          dotnet run --project Tools/MarketMcpChecks/MarketMcpChecks.csproj -c Release -- --h4-discovery
          node Tools/h4-zone-live-checks.cjs
          dotnet run --project Tools/ZonePriceImport/ZonePriceImport.csproj -c Release -- --checks

      - name: SQL wake-up GitHub App regression (ephemeral key, intercepted HTTP, no SQL)
        run: dotnet run --project Tools/MarketTriggerChecks/MarketTriggerChecks.csproj -c Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F4570A6E2EA44A23BE899A9751F15D52 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_71B0AFE26429422AB6CC3D81C63576A4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5AB6A357FD164277B9EFF94C03CF8964 }}

      - name: Route backend and MCP to the restored free SQL database
        shell: pwsh
        env:
          RECOVERY_SQL_CONNECTION: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sql = [System.Data.SqlClient.SqlConnectionStringBuilder]::new($env:RECOVERY_SQL_CONNECTION)
          if ($sql.get_InitialCatalog() -ne 'seasonality-free-20261022' -or $sql.get_DataSource() -notin @('seasonality.database.windows.net','tcp:seasonality.database.windows.net','seasonality.database.windows.net,1433','tcp:seasonality.database.windows.net,1433')) { throw 'Unexpected SQL target; no settings changed' }
          $sites = @(az resource list --resource-type Microsoft.Web/sites --name Seasonality --query '[].{name:name,group:resourceGroup}' --output json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $sites.Count -ne 1) { throw 'Could not resolve the existing Seasonality app uniquely' }
          az webapp config connection-string set --name $sites[0].name --resource-group $sites[0].group --connection-string-type SQLAzure --settings "DefaultConnection=$($env:RECOVERY_SQL_CONNECTION)" --output none
          if ($LASTEXITCODE -ne 0) { throw 'Backend SQL connection update failed' }
          az webapp config appsettings set --name $sites[0].name --resource-group $sites[0].group --settings "ConnectionStrings__DefaultConnection=$($env:RECOVERY_SQL_CONNECTION)" --output none
          if ($LASTEXITCODE -ne 0) { throw 'Backend SQL appsetting update failed' }
          $actual = az webapp config connection-string list --name $sites[0].name --resource-group $sites[0].group --query '[?name==`DefaultConnection`].connectionString | [0]' --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($actual)) { throw 'SQL target readback failed' }
          $readback = [System.Data.SqlClient.SqlConnectionStringBuilder]::new($actual)
          if ($readback.get_InitialCatalog() -ne 'seasonality-free-20261022') { throw 'SQL target readback mismatch' }
          Write-Host 'Backend/MCP SQL target verified: seasonality-free-20261022. Secrets withheld.'

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Seasonality'
          slot-name: 'Production'
          package: .

