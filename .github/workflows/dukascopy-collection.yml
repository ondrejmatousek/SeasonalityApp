name: Dukascopy market collection
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated FX symbols, empty collects all 39
        type: string
        default: ''
      months:
        description: Number of source H1 months to collect
        type: string
        default: '15'
permissions:
  contents: read
concurrency:
  group: seasonality-dukascopy-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify decoding and session boundaries
        run: python Tools/dukascopy-collect-checks.py
      - name: Collect original Dukascopy BID H1 and validate closed FX sessions
        env:
          SYMBOLS: ${{ inputs.symbols }}
          MONTHS: ${{ inputs.months }}
        run: |
          args=(--months "$MONTHS")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          python Tools/dukascopy-collect.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dukascopy-collection
          path: artifacts/dukascopy/
          retention-days: 7
          if-no-files-found: error
