name: Dukascopy market collection
on:
  schedule:
    # UTC; starts after both winter and summer NY17-aligned H4 closes.
    - cron: '23 2,6,10,14,18,22 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated FX symbols, empty collects all 49
        type: string
        default: ''
      months:
        description: Number of source H1 months to collect
        type: string
        default: '4'
      store:
        description: Import complete registry into isolated Dukascopy SQL and publish
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: seasonality-dukascopy-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify decoding and session boundaries
        run: python Tools/dukascopy-collect-checks.py
      - name: Collect original Dukascopy BID H1 and validate closed FX sessions
        env:
          SYMBOLS: ${{ inputs.symbols }}
          MONTHS: ${{ inputs.months || '4' }}
        run: |
          args=(--months "$MONTHS")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          python Tools/dukascopy-collect.py "${args[@]}"
      - uses: actions/setup-dotnet@v4
        if: github.event_name == 'schedule' || (inputs.store && inputs.symbols == '')
        with:
          dotnet-version: '10.0.x'
      - name: Store verified source history and export Dukascopy projection
        if: github.event_name == 'schedule' || (inputs.store && inputs.symbols == '')
        env:
          SEASONALITY_H4_SQL_CONNECTION: ${{ secrets.SEASONALITY_H4_SQL_CONNECTION }}
        run: |
          dotnet build Tools/DukascopyImport/DukascopyImport.csproj -c Release
          dotnet Tools/DukascopyImport/bin/Release/net10.0/DukascopyImport.dll --import --input artifacts/dukascopy --confirm-database seasonality-free-h4-20261118 --export --output artifacts/dukascopy-sql/source.json
      - name: Update prospective ledger within the same SQL wake-up
        if: github.event_name == 'schedule' || (inputs.store && inputs.symbols == '')
        env:
          SEASONALITY_H4_SQL_CONNECTION: ${{ secrets.SEASONALITY_H4_SQL_CONNECTION }}
        run: |
          node -e "const fs=require('fs'),path=require('path'),src='data/generated/site',dst='artifacts/dukascopy-paper-site',m=JSON.parse(fs.readFileSync(src+'/data/manifest.json'));for(const f of ['index.html','data/manifest.json',m.zonePrices.path.slice(1)]){fs.mkdirSync(path.dirname(dst+'/'+f),{recursive:true});fs.copyFileSync(src+'/'+f,dst+'/'+f)}"
          node Tools/dukascopy-zone-snapshot.cjs artifacts/dukascopy-paper-site artifacts/dukascopy-sql/source.json
          dotnet build Tools/PaperTradeStore/PaperTradeStore.csproj -c Release
          dotnet Tools/PaperTradeStore/bin/Release/net10.0/PaperTradeStore.dll --ensure-schema --load --output artifacts/dukascopy-paper-previous.json
          node Tools/h4-paper-update.cjs artifacts/dukascopy-paper-site artifacts/dukascopy-paper-previous.json artifacts/dukascopy-paper-next.json
          dotnet Tools/PaperTradeStore/bin/Release/net10.0/PaperTradeStore.dll --save artifacts/dukascopy-paper-next.json --output artifacts/dukascopy-sql/ledger.json
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'schedule' || (inputs.store && inputs.symbols == ''))
        with:
          name: dukascopy-sql-source
          path: artifacts/dukascopy-sql/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dukascopy-collection
          path: artifacts/dukascopy/
          retention-days: 2
          if-no-files-found: error
