name: Update data and publish static seasonality

on:
  push:
    branches:
      - master
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      reuse_snapshot:
        description: 'Reuse latest static price/COT artifact; no SQL access or source update'
        type: boolean
        default: false
      export_only:
        description: 'Export and publish current SQL snapshot without updating sources'
        type: boolean
        default: false

concurrency:
  group: seasonality-data-update
  cancel-in-progress: false

jobs:
  cot-update:
    if: inputs.export_only != true && inputs.reuse_snapshot != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SeasonalityApp.csproj
      - name: Update CFTC COT history
        run: dotnet run --project SeasonalityApp.csproj --configuration Release --no-restore -- --update-cot-once
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
  update:
    if: inputs.export_only != true && inputs.reuse_snapshot != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SeasonalityApp.csproj
      - run: dotnet run --project SeasonalityApp.csproj --configuration Release --no-restore -- --update-once
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
  export-static:
    # Never publish a partially updated or failed data snapshot.
    needs: [update, cot-update]
    if: ${{ !cancelled() && (inputs.reuse_snapshot == true || inputs.export_only == true || (needs.update.result == 'success' && needs['cot-update'].result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build SeasonalityApp.slnx --configuration Release
      - run: dotnet run --project Tools/CotChecks/CotChecks.csproj --configuration Release
      - run: node Tools/chart-ui-checks.cjs
      - run: node Tools/market-help-checks.cjs
      - run: node Tools/asset-category-checks.cjs
      - run: node Tools/tradingview-link-checks.cjs
      - run: node Tools/screener-checks.cjs
      - run: node Tools/reliability-checks.cjs
      - run: node Tools/cot-analogs-checks.cjs
      - run: node Tools/confluence-checks.cjs
      - run: node Tools/opportunities-checks.cjs
      - run: node Tools/opportunity-ranking-checks.cjs
      - run: node Tools/opportunity-sorting-checks.cjs
      - run: node Tools/opportunity-scoring-v2-checks.cjs
      - run: node Tools/opportunity-scoring-v3-checks.cjs
      - name: Reuse latest successful immutable dataset (no SQL)
        if: inputs.reuse_snapshot == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "seasonality-static-site" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          test "$run_id" != null
          gh run download "$run_id" --name seasonality-static-site --dir artifacts/static-site
          dotnet run --project SeasonalityApp.csproj --configuration Release --no-build -- --render-static-shell --output artifacts/static-site
      - name: Export read-only SQL snapshot to static HTML and JSON
        if: inputs.reuse_snapshot != true
        run: dotnet run --project SeasonalityApp.csproj --configuration Release --no-build -- --export-static --output artifacts/static-site --Logging:LogLevel:Microsoft.EntityFrameworkCore.Database.Command=Warning
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
      - name: Build compact screener snapshot
        run: node Tools/build-screener.cjs artifacts/static-site
      - name: Find daily seasonal extremes and compare historical COT
        run: node Tools/build-opportunities.cjs artifacts/static-site
      - name: Restore cumulative V3 ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "seasonality-v3-live-ledger" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -n "$run_id" ] && [ "$run_id" != null ]; then
            gh run download "$run_id" --name seasonality-v3-live-ledger --dir artifacts/v3-live-ledger
            test -s artifacts/v3-live-ledger/ledger.json
          fi
      - name: Append immutable V3 forecasts and close-based completed outcomes
        run: node Tools/v3-live-tracking.cjs artifacts/static-site artifacts/v3-live-ledger/ledger.json
      - name: Validate every exported ticker, COT index and immutable file
        run: node Tools/static-site-checks.cjs artifacts/static-site
      - uses: actions/upload-artifact@v4
        with:
          name: seasonality-v3-live-ledger
          path: artifacts/v3-live-ledger/ledger.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: seasonality-static-site
          path: artifacts/static-site/
          retention-days: 1
          compression-level: 9
  deploy-static:
    needs: export-static
    if: ${{ !cancelled() && needs['export-static'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_STATIC_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seasonality-static-site
          path: artifacts/static-site
      - name: Deploy static site (no API, App Service or runtime SQL)
        if: env.HAS_STATIC_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/static-site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: master
      - name: Explain pending hosting setup
        if: env.HAS_STATIC_TOKEN != 'true'
        run: echo 'Static site export is verified and available as an artifact. Azure publication is pending AZURE_STATIC_WEB_APPS_API_TOKEN; the existing App Service remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
