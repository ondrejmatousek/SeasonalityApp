name: Morning analytics

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
concurrency:
  group: seasonality-data-update
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Record actual checked-out source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select 06:00 Europe/Prague cron (DST aware)
        id: gate
        run: node Tools/daily-health.cjs --gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Restore audited historical seed and cumulative same-provider state
        id: bootstrap
        if: steps.gate.outputs.run == 'true'
        run: node Tools/market-history-seed.cjs
      - name: Release build and regression tests
        id: build
        if: steps.gate.outputs.run == 'true'
        run: |
          dotnet build SeasonalityApp.slnx --configuration Release
          dotnet run --project Tools/CotChecks/CotChecks.csproj --configuration Release
          node Tools/morning-health-checks.cjs
          node Tools/market-daily-ingest-checks.cjs
          node Tools/core-market-checks.cjs
          node Tools/opportunity-ranking-checks.cjs
          node Tools/opportunity-scoring-v2-checks.cjs
          node Tools/opportunity-scoring-v3-checks.cjs
          node Tools/historical-cot-comparison-checks.cjs
          node Tools/htf-checks.cjs
      - name: Ingest, refresh existing Yahoo stocks/CFTC and rebuild staging analytics
        if: steps.gate.outputs.run == 'true'
        id: analytics
        run: node Tools/morning-run.cjs
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
      - name: Restore unchanged cumulative V3 live tracking
        id: tracking
        if: steps.gate.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "seasonality-v3-live-ledger" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -n "$run_id" ] && [ "$run_id" != null ]; then
            gh run download "$run_id" --name seasonality-v3-live-ledger --dir artifacts/v3-live-ledger
          fi
          node Tools/v3-live-tracking.cjs artifacts/morning-site artifacts/v3-live-ledger/ledger.json
          node Tools/static-site-checks.cjs artifacts/morning-site
      - name: Publish generated data only after all critical checks
        if: steps.gate.outputs.run == 'true' && success()
        id: publish
        run: node Tools/publish-morning-data.cjs
      - name: Always record failures and Job Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: node Tools/finalize-morning-health.cjs
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FAILURE_STAGE: ${{ steps.bootstrap.outcome == 'failure' && 'Historical seed restore' || steps.build.outcome == 'failure' && 'Release build / regression tests' || steps.analytics.outcome == 'failure' && 'Market ingestion / source refresh / analytics rebuild' || steps.tracking.outcome == 'failure' && 'Live tracking / static verification' || steps.publish.outcome == 'failure' && 'Static publication staging' || 'Unknown or cancelled step' }}
      - name: Commit only generated data/state and health audits
        id: commit
        if: always() && steps.gate.outputs.run == 'true'
        env:
          ANALYTICS_OK: ${{ steps.publish.outcome == 'success' }}
        run: |
          git config user.name 'seasonality-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/daily-health
          if [ "$ANALYTICS_OK" = true ]; then
            git add data/generated/site
            if [ -n "$(find data/market-state -maxdepth 1 -name '*.json' -print -quit 2>/dev/null)" ]; then git add data/market-state; fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Morning data and health $(TZ=Europe/Prague date +%F)"
            # Fail on a concurrent writer; never force-push or overwrite its market input.
            git push origin HEAD:master
          fi
      - name: Summarize publication/commit failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: node Tools/finalize-morning-health.cjs
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FAILURE_STAGE: ${{ steps.commit.outcome == 'failure' && 'Generated-data commit / non-forcing push' || 'See failed step above' }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: daily-health
          path: artifacts/daily-health/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.publish.outcome == 'success'
        with:
          name: seasonality-v3-live-ledger
          path: artifacts/v3-live-ledger/ledger.json
          retention-days: 90
