name: Morning analytics

on:
  schedule:
    - cron: '7,22,37,52 1-8 * * *'
  workflow_dispatch:
    inputs:
      sql_inbox_shadow:
        description: 'Process one SQL inbox receipt and rehearse analytics; NO production publication'
        type: boolean
        default: false
      sql_publish:
        description: 'Publish latest accepted SQL generation after fresh stock/COT export and checks'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
concurrency:
  group: seasonality-data-update
  cancel-in-progress: false

jobs:
  sql-inbox-shadow:
    if: (github.event_name == 'workflow_dispatch' && (inputs.sql_inbox_shadow || inputs.sql_publish)) || (github.event_name == 'schedule' && (vars.MARKET_DAILY_SQL_MODE == '' || vars.MARKET_DAILY_SQL_MODE == 'shadow' || vars.MARKET_DAILY_SQL_MODE == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      run: ${{ steps.queue_gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip SQL wake-up before collection or after today's committed publication
        id: queue_gate
        run: |
          node Tools/market-daily-sql-schedule-checks.cjs
          node Tools/market-daily-sql-schedule.cjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          SQL_MODE: ${{ vars.MARKET_DAILY_SQL_MODE }}
      - uses: actions/setup-dotnet@v4
        if: steps.queue_gate.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Build explicit worker and check admission engine
        if: steps.queue_gate.outputs.run == 'true'
        run: |
          node Tools/market-history-seed.cjs
          dotnet build SeasonalityApp.slnx --configuration Release
          node Tools/market-daily-sql-worker-checks.cjs
          node Tools/market-daily-preflight-checks.cjs
      - name: Fetch read-only ETF HTF evidence for analytics rehearsal
        if: steps.queue_gate.outputs.run == 'true' && inputs.sql_inbox_shadow
        shell: pwsh
        run: ./Tools/fetch-htf-ohlc.ps1 -OutputDir artifacts/sql-inbox-htf
      - name: Process ONE receipt into SQL shadow history and verify private analytics
        if: steps.queue_gate.outputs.run == 'true' && inputs.sql_inbox_shadow
        run: dotnet bin/Release/net10.0/SeasonalityApp.dll --process-market-inbox-once
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
          MarketDailyInboxWorker__Enabled: 'true'
          MarketDailyInboxWorker__RepositoryRoot: ${{ github.workspace }}
          MarketDailyInboxWorker__BootstrapState: ${{ github.workspace }}/data/market-state
          MarketDailyInboxWorker__AnalyticsSnapshot: ${{ github.workspace }}/data/generated/site
          MarketDailyInboxWorker__HtfFeed: ${{ github.workspace }}/artifacts/sql-inbox-htf
      - name: Drain up to five SQL receipts with lease/CAS validation, no publication
        if: steps.queue_gate.outputs.run == 'true' && !inputs.sql_inbox_shadow
        run: dotnet bin/Release/net10.0/SeasonalityApp.dll --process-market-inbox-queue
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
          MarketDailyInboxWorker__Enabled: 'true'
          MarketDailyInboxWorker__RepositoryRoot: ${{ github.workspace }}
          MarketDailyInboxWorker__BootstrapState: ${{ github.workspace }}/data/market-state
      - name: Record SQL queue failure for the Data view
        if: failure()
        run: node Tools/finalize-morning-health.cjs
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          JOB_STATUS: failure
          FAILURE_STAGE: SQL queue validation or worker startup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: daily-health
          path: artifacts/daily-health/
          retention-days: 90
  sql-publication:
    needs: sql-inbox-shadow
    if: success() && needs.sql-inbox-shadow.outputs.run == 'true' && !inputs.sql_inbox_shadow && ((github.event_name == 'workflow_dispatch' && inputs.sql_publish) || (github.event_name == 'schedule' && vars.MARKET_DAILY_SQL_MODE == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record checked-out source
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Release build and SQL publication regressions
        run: |
          node Tools/market-history-seed.cjs
          dotnet build SeasonalityApp.slnx --configuration Release
          node Tools/market-daily-sql-publication-checks.cjs
          node Tools/morning-health-checks.cjs
      - name: Select latest accepted SQL generation and skip committed duplicates
        id: gate
        run: dotnet bin/Release/net10.0/SeasonalityApp.dll --export-market-inbox
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
          MarketDailyInboxWorker__Enabled: 'true'
          MarketDailyInboxWorker__RepositoryRoot: ${{ github.workspace }}
      - name: Build from exact SQL evidence with existing live Yahoo stocks/CFTC refresh
        if: steps.gate.outputs.run == 'true'
        run: node Tools/market-daily-sql-publication.cjs artifacts/sql-market/context.json
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
      - name: Preserve existing V3 live ledger and verify final static output
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "seasonality-v3-live-ledger" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -n "$run_id" ] && [ "$run_id" != null ]; then
            gh run download "$run_id" --name seasonality-v3-live-ledger --dir artifacts/v3-live-ledger
          fi
          node Tools/v3-live-tracking.cjs artifacts/morning-site artifacts/v3-live-ledger/ledger.json
          node Tools/static-site-checks.cjs artifacts/morning-site
      - name: Fence SQL generation and atomically commit verified site/state without force push
        id: publish
        if: steps.gate.outputs.run == 'true'
        run: dotnet bin/Release/net10.0/SeasonalityApp.dll --publish-market-inbox
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SEASONALITY_CONNECTION_STRING }}
          MarketDailyInboxWorker__Enabled: 'true'
          MarketDailyInboxWorker__RepositoryRoot: ${{ github.workspace }}
          MarketDailySqlPublication__Enabled: 'true'
      - name: Record publication failure without changing committed web
        if: always() && (steps.gate.outputs.run == 'true' || failure())
        run: node Tools/finalize-morning-health.cjs
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FAILURE_STAGE: SQL generation build / fence / non-forcing commit
      - uses: actions/upload-artifact@v4
        if: always() && (steps.gate.outputs.run == 'true' || failure())
        with:
          name: daily-health
          path: artifacts/daily-health/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.publish.outcome == 'success'
        with:
          name: seasonality-v3-live-ledger
          path: artifacts/v3-live-ledger/ledger.json
          retention-days: 90
